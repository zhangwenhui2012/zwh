name: stock-monitor

on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python monitor.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/quotes.json state.json
          if git diff --cached --quiet; then
            echo "no data change, skip commit."
            exit 0
          fi
          git commit -m "chore: update quotes & state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed."
              exit 0
            fi
            echo "push rejected, syncing with origin (attempt $i)..."
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            sleep 2
          done
          echo "push still failing after retries"
          exit 1
